<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Portal do IPIL</title>
    <link rel="stylesheet" href="estilos/style-ipil.css">
</head>
<body>
    <section>
        <img src="img/ipil_icon.png" alt="">
        <h1>Entre no Portal do IPIL</h1>
        <p>Insira os seus dados de utilizador <br> abaixo para fazer o login</p> <br>
        <form action="#" method="post">
            <p class="point">Utilizador <br> <input type="text" name="nome" id="inome" required minlength="4" placeholder="00000-000000000LA041">
            <label for="inome"></label></p>
            <p class="point">Palavra-passe <a href="#" id="especial">Esqueceu a Palavra-passe?</a>
            <input type="password" name="password" id="isenha" required minlength="8" placeholder="*****">
            <label for="isenha"></label></p>
            <input type="submit" value="Login">
            <p id="finalp">Não tem conta? <a href="#">Cadastre-se</a> ou <br> <a href="#" class="link">Consulte o seu cadastro</a></p>

        </form>



    </section>
</body>
</html>
